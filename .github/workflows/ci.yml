name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: render/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: render
      - run: npm run typecheck
        working-directory: render

  golden:
    name: Golden test (Docker, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          # Same CPU architecture as Apple Silicon Macs, whose Docker runs linux/arm64.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker compose build
      - name: Run golden test
        run: docker compose run --rm worker stagorix verify
      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-output-${{ matrix.arch }}
          path: workspace/verify/
          retention-days: 14
