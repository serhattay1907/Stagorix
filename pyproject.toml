[project]
name = "stagorix"
version = "0.1.0"
description = "Brand-agnostic, multi-agent pipeline that turns news and your own videos into branded vertical videos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.1",
    "rich==15.0.0",
    "typer==0.27.3",
]

[project.scripts]
stagorix = "stagorix.cli:app"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stagorix"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["pilot"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
