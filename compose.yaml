# CPU profile (default) — the same on macOS, Windows and Linux:
#   docker compose up --build
# GPU profile (NVIDIA on Linux or Windows WSL2):
#   docker compose -f compose.yaml -f compose.gpu.yaml up --build
# Golden test:
#   docker compose run --rm worker stagorix verify
name: stagorix

services:
  worker:
    build:
      context: .
      args:
        BASE_IMAGE: debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
    image: stagorix-worker:cpu
    env_file:
      - path: .env
        required: false
    volumes:
      - ./brands:/app/brands
      - ./workspace:/app/workspace
      - ./tests/golden:/app/tests/golden
